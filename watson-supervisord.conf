stdout_logfile=/home/administrador/palace/Watson/logs/supervisor.log
environment=PYTHONUNBUFFERED="1",PATH="/home/administrador/palace/Watson/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",VIRTUAL_ENV="/home/administrador/palace/Watson/.venv"

