[program:watson]
command=/home/administrador/palace/Watson/.venv/bin/python -m uvicorn api:app --host 0.0.0.0 --port 9000
directory=/home/administrador/palace/Watson
user=root
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/home/administrador/palace/Watson/logs/supervisor.log
environment=PYTHONUNBUFFERED="1"

; Para usar o executavel PyInstaller, comente a linha 'command' acima e descomente:
; command=/home/administrador/palace/Watson/dist/watson/watson

[group:watson]
programs=watson