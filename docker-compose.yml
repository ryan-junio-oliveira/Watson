# Watson RAG - Docker Compose
# Requisito único: Docker + Docker Compose
# Sobe: watson (API) + ollama (LLM) + ollama-init (baixa modelos automaticamente)
# Uso:
#   docker compose up -d --build
#   docker compose logs -f watson       # acompanhar
#   docker compose down                 # parar (volumes persistem)
#   docker compose down -v              # parar + apagar dados (reset total)

services:
  watson:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watson
    ports:
      - "0.0.0.0:${API_PORT:-9000}:9000"
    env_file:
      - path: .env
        required: false
    environment:
      # Sobrescreve o .env para apontar ao serviço ollama do compose
      OLLAMA_BASE_URL: http://ollama:11434
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-9000}
      # Garante que o cache HF fique no volume (bake não inclui modelo ~1GB)
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/huggingface
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      VISION_MODEL: ${VISION_MODEL:-moondream}
      WATCHFILES_FORCE_POLLING: "true"
    command: ["python", "-m", "uvicorn", "cli.api:app", "--host", "0.0.0.0", "--port", "9000", "--reload", "--reload-dir", "/app"]
    volumes:
      # Live code sync: mudanças fora do container refletem dentro sem rebuild
      - .:/app
      # Esconde venv/.git do host para não quebrar o container (anon volumes)
      - /app/.venv
      - /app/.git
      - /app/__pycache__
      # Documentos: bind já coberto por .:/app, mas mantido explícito
      - ./documents:/app/documents
      # Dados persistentes (volumes nomeados sobrepõem o bind — não apagam com down)
      - watson_chroma:/app/database/chroma
      - watson_data:/app/database
      - watson_logs:/app/logs
      - hf_cache:/app/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
      start_interval: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: watson-ollama
    ports:
      - "0.0.0.0:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      # Imagem ollama não tem curl/wget — usar o próprio binário ollama para checar o daemon
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Job efêmero: aguarda ollama ficar healthy e baixa os modelos do .env
  # (gemma3:4b + moondream). Roda uma vez por `docker compose up`.
  ollama-init:
    image: ollama/ollama:latest
    container_name: watson-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # Lê OLLAMA_MODEL/VISION_MODEL do .env do host via interpolação do compose
    # Usa apenas `ollama` CLI (imagem não tem curl/wget)
    command:
      - |
        set -eu
        echo "[ollama-init] Aguardando Ollama em http://ollama:11434..."
        for i in $$(seq 1 30); do
          if ollama list >/dev/null 2>&1; then break; fi
          echo "[ollama-init]  ... tentativa $$i/30"
          sleep 2
        done
        echo "[ollama-init] Ollama pronto. Verificando modelos..."
        for MODEL in "${OLLAMA_MODEL:-gemma3:4b}" "${VISION_MODEL:-moondream}"; do
          [ -z "$$MODEL" ] && continue
          echo "[ollama-init] Verificando $$MODEL..."
          if ollama list | grep -qi "$$MODEL"; then
            echo "[ollama-init]  $$MODEL já existe, pulando."
          else
            echo "[ollama-init]  Baixando $$MODEL (pode demorar)..."
            if ! ollama pull "$$MODEL"; then
              echo "[ollama-init] AVISO: falha ao baixar $$MODEL (tente: docker exec watson-ollama ollama pull $$MODEL)"
            fi
          fi
        done
        echo "[ollama-init] Concluído."
    restart: "no"

volumes:
  watson_chroma:
  watson_data:
  watson_logs:
  hf_cache:
  ollama_data:
